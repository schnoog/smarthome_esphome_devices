esphome:
  name: sensor-bmp280-4

esp32:
  board: lolin_s3
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: "CiYA/PPrO+exKqNUzuUdrzBO3ih9OVX66DbKyo9cB0g="
  reboot_timeout: 0s                        # Prevent reboot if HA connection lost


web_server:
  port: 80

i2c:
  sda: GPIO42
  scl: GPIO41

sensor:
  - platform: bmp280_i2c
    temperature:
      name: "bmp280_4 Temperature"
      id: temperatur
      oversampling: 16x
      on_value:
        - mqtt.publish:
            topic: "bmp280_4/temperature"
            payload: !lambda 'return to_string(id(temperatur).state);'

    pressure:
      name: "bmp280_4 Pressure"
      id: luftdruck
      on_value:
        - mqtt.publish:
            topic: "bmp280_4/pressure"
            payload: !lambda 'return to_string(id(luftdruck).state);'



    address: 0x76
    update_interval: 10s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

mqtt:
  id: bmp280_4
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_retain: true
  discovery_unique_id_generator: mac
  discovery_object_id_generator: device_name
  birth_message:
  will_message:
  shutdown_message:
  on_message:
    - topic: esp/sleep_mode
      payload: 'OFF'
      then:
        - deep_sleep.prevent: deep_sleep_1
    - topic: esp/sleep_mode
      payload: 'ON'
      then:
        - deep_sleep.allow: deep_sleep_1


# We need to use globals to share sensor state without circular references.
globals:
   - id: temperature
     type: double
     restore_value: no
     initial_value: 'NAN'
   - id: pressure
     type: double
     restore_value: no
     initial_value: 'NAN'




deep_sleep:
  id: deep_sleep_1
  run_duration: 20s
  sleep_duration: 580s

esphome:
  name: esp32sipclient-1

esp32:
  board: lolin_s3
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: "CiYA/PPrO+exKqNUzuUdrzBO3ih9OVX66DbKyo9cB0g="
  reboot_timeout: 0s                        # Prevent reboot if HA connection lost



web_server:
  port: 80

i2c:
  sda: GPIO42
  scl: GPIO41

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

mqtt:
  id: esp32sip_client1
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_retain: true
  discovery_unique_id_generator: mac
  discovery_object_id_generator: device_name
  birth_message:
  will_message:
  shutdown_message:


external_components:
  - source: github://eigger/espcomponents@latest
    components: [ sip_client ]
    refresh: always

# Basic VoIP/SIP Setup
sip_client:
  microphone: mic_id
  speaker: spk_id
  server: "192.168.178.1"
  username: "esphome-client1"
  password: !secret sippass

  on_registered:
    - logger.log: "SIP registered"
  on_incoming_call:
    - logger.log:
        format: "Incoming call from %s"
        args: [caller.c_str()]
    - mqtt.publish:
        topic: "fritzbox/phonecall"
        payload: !lambda 'return caller.c_str();'
    # Auto-answer example
   # - sip_client.answer: my_sip
  on_call_connected:
    - logger.log: "Call connected"
  on_call_ended:
    - logger.log: "Call ended"
    - mqtt.publish:
        topic: "fritzbox/phonecall"
        payload: "0"


  on_dtmf:
    - logger.log:
        format: "Received DTMF %s"
        args: [digit.c_str()]




i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO16

  - id: i2s_spk
    i2s_lrclk_pin: GPIO12
    i2s_bclk_pin: GPIO11

microphone:
  - platform: i2s_audio
    id: mic_id
    i2s_audio_id: i2s_mic
    adc_type: external
    i2s_din_pin: GPIO17
    pdm: false

speaker:
  - platform: i2s_audio
    id: spk_id
    i2s_audio_id: i2s_spk
    dac_type: external
    i2s_dout_pin: GPIO13













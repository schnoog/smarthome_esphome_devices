# Add the credentials to connect to your wifi network
wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: sntp
    id: esptime
    timezone: Europe/Berlin

ota:
  - platform: esphome
    password: !secret ota_password

debug:
  update_interval: 5s


display:
  - platform: mipi_rgb
    id: my_display
    model: ESP32-S3-TOUCH-LCD-7-800X480
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB


binary_sensor:
  - platform: status
    name: "${name} Connection Status"

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    internal: true
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${name} WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""
    icon: mdi:wifi
  # Free memory info
  - platform: debug
    free:
      name: "Heap Free"
    psram:
      name: "Free PSRAM"  


ch422g:
  id: ch422g_hub

touchscreen:
  platform: gt911
  id: my_touchscreen
  interrupt_pin: GPIO4
  reset_pin: 
    ch422g: ch422g_hub
    number: 1
#  on_touch:
#    - lambda: |-
#        if (!id(backlight).remote_values.is_on()) {
#        id(light_up).execute();
#        }

i2c:
  scl: GPIO9
  sda: GPIO8
  scan: True
    
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "${name} Back Light"
    restore_mode: RESTORE_AND_ON
#    on_turn_on: 
#      then:
#        - script.execute: light_up
#        - lvgl.resume:
#    on_turn_off: 
#      then:
#        - lvgl.pause:

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO16
    frequency: 1000Hz
    min_power: 0.3
    zero_means_zero: True    


#fonts and styles for display
font:
  - file:
      type: gfonts
      family: IBM+Plex+Mono
      weight: 700
    id: clock_font
    size: 260
    bpp: 4

  - file:
      type: gfonts
      family: IBM+Plex+Mono
      weight: 700
    id: info_font
    size: 85
    bpp: 4

  - file:
      type: gfonts
      family: IBM+Plex+Mono
      weight: 700
    id: small_info_font
    size: 70
    bpp: 4

#actual weather clock layout
lvgl:
  style_definitions:
    - id: clock_style
      text_font: clock_font
      text_color: 0xDDDDDD
    - id: outdoor_style
      text_font: info_font
      text_color: 0x008001
    - id: small_outdoor_style
      text_font: small_info_font
      text_color: 0x008001
      translate_y: -4
      opa: 0.8
    - id: indoor_style
      text_font: info_font
      text_color: 0xBDB76B
    - id: small_indoor_style
      text_font: small_info_font
      text_color: 0xBDB76B
      translate_y: -4
      opa: 0.8
    - id: high_style
      text_font: info_font
      text_color: 0xFE0000
    - id: small_high_style
      text_font: small_info_font
      text_color: 0xFE0000
      translate_y: -4
      opa: 0.8
    - id: low_style
      text_font: info_font
      text_color: 0x1F90FF
    - id: small_low_style
      text_font: small_info_font
      text_color: 0x1F90FF
      translate_y: -4
      opa: 0.8
  pages:
    - id: main_page
      width: 100%
      bg_color: Black
      widgets:
        # Clock
        - label:
            text: "--:--"
            id: display_time
            styles: clock_style
            align: top_mid
            x: 0
            y: -40
            text_align: center
        # Outdoor
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_left
            x: 15
            y: -25
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: start
                flex_align_cross: end
                pad_column: 5px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: outdoor_humidity
                  styles: outdoor_style
                  text_align: left
              - label:
                  styles: small_outdoor_style
                  text: "%"
                  text_align: left
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_left
            x: 15
            y: -115
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: start
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: outdoor_temperature
                  styles: outdoor_style
                  text_align: left
              - label:
                  text: ${tempscale}
                  styles: small_outdoor_style
                  text_align: left
        # Forecast
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_mid
            x: 0
            y: -25
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: center
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"
                  id: today_low
                  styles: low_style
                  text_align: left
              - label:
                  styles: small_low_style
                  text: ${tempscale}
                  text_align: left
        - obj:
            scrollbar_mode: "OFF"
            border_width: 0
            pad_all: 0px
            align: bottom_mid
            x: 0
            y: -115
            width: 240
            height: 100
            bg_color: Black
            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: center
                flex_align_cross: end
                pad_column: 0px
                pad_row: 0px
            widgets:
              - label:
                  text: "--"

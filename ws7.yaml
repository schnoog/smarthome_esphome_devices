substitutions:
# Device setting  
  board: esp32-s3-devkitc-1
  name: "esphome-ws-800"
  comment: "my smaller device"
  mdi: Fonts/materialdesignicons-webfont.ttf 
  font: gfonts://Roboto
  characters: " !#%'()+,-./0123456789:;<>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz{|}°²³µäÄüÜöÖß"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB  
  cpu_frequency: 240MHz
  framework:
    type: esp-idf  
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH: "4096"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "1024"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "37268"           
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_MEM_WITH_ESP_MEMMALLOC: "y"
      CONFIG_BT_ENABLED: "n"
      CONFIG_BLUEDROID_ENABLED: "n"

esphome:
  name: "${name}"
  comment: "${comment}"
  platformio_options:
    board_build.arduino.memory_type: qio_opi
    board_build.flash_mode: dio


psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: INFO
  logs:
    sensor: WARN  

api:
  encryption:
    key: "CiYA/PPrO+exKqNUzuUdrzBO3ih9OVX66DbKyo9cB0g="
  reboot_timeout: 0s                        # Prevent reboot if HA connection lost
 # on_client_connected:
 #   - if:

            widgets:
              - label:
                  id: lblTime
                  x: 10
                  y: 5
                  width: 215
                  height: 70
                  text: !lambda |-
                    if (!id(esptime).now().is_valid()) {
                      return std::string("--:--");
                    }

                    char buf[6];
                    snprintf(buf, sizeof(buf), "%02d:%02d",
                            id(esptime).now().hour,
                            id(esptime).now().minute);

                    return std::string(buf);
                  text_color: 0xF1F5F9
                  text_align: CENTER
                  long_mode: CLIP
                  text_font: outfit_44

              - label:
                  id: lblDate

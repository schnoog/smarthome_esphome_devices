interval:

  - interval: 1min
    then:
      - lambda: |-
          auto now = id(esptime).now();

          if (!now.is_valid()) {
            return;
          }

          int minutes = now.hour * 60 + now.minute;

          if (minutes >= 22 * 60 || minutes < 6 * 60) {
            // 22:00 - 06:00 -> 10 %
            auto call = id(back_light).turn_on();
            call.set_brightness(0.10);
            call.perform();

          } else if (minutes < 8 * 60) {
            // 06:00 - 08:00 -> 70 %
            auto call = id(back_light).turn_on();
            call.set_brightness(0.70);
            call.perform();

          } else if (minutes < 20 * 60) {
            // 08:00 - 20:00 -> 100 %
            auto call = id(back_light).turn_on();
            call.set_brightness(1.0);
            call.perform();

          } else {
            // 20:00 - 22:00 -> 50 %
            auto call = id(back_light).turn_on();
            call.set_brightness(0.50);
            call.perform();
          }

  - interval: 2s
    then:
      - lvgl.widget.refresh: lblTemp1
      - lvgl.widget.refresh: lblHum
      - lvgl.widget.refresh: lblTemp2
      - lvgl.widget.refresh: lblTemp3
      - lvgl.widget.refresh: lblTemp4
      - lvgl.widget.refresh: lblTemp5
      - lvgl.widget.refresh: lblTime  
      - lvgl.widget.refresh: lblDate
      - lvgl.widget.refresh: lblTempExt1    

  - interval: 30s
    then:
      - lambda: |-

          auto now = id(esptime).now();

          int hh = 0;
          int mm = 0;
          int diff = 9999;
          int now_min = 0;
          int msg_min = 0;
          uint32_t color;
          bool valid;

          valid = sscanf(
              id(s0Update).state.c_str(),
              "%d:%d",
              &hh,
              &mm
          ) == 2;

          diff = 9999;

          if (valid) {
            now_min = now.hour * 60 + now.minute;
            msg_min = hh * 60 + mm;

            diff = now_min - msg_min;

            if (diff < 0)
              diff += 24 * 60;
          }

          if (!valid) {
            color = 0xEF4444;       // rot
          } else if (diff < 11) {
            color = 0x10B981;       // grün
          } else if (diff < 31) {
            color = 0xF59E0B;       // orange
          } else {
            color = 0xEF4444;       // rot
          }

          lv_obj_set_style_border_color(
              id(widget_Temp1),
              lv_color_hex(color),
              LV_PART_MAIN
          );

          lv_obj_set_style_border_color(
              id(widget_Hum),
              lv_color_hex(color),

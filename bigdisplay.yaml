esp32_hosted:
  variant: esp32c6
  active_high: true
  reset_pin: GPIO32
  cmd_pin: GPIO19
  clk_pin: GPIO18
  bus_width: 1
  d0_pin: GPIO14
  sdio_frequency: 40MHz

ota:
  - platform: esphome
    password: !secret ota_password




wifi:
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.178.108
    gateway: 192.168.178.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Advance-P4-10.1-Inch"
    password: !secret wifi_password





captive_portal:
  

i2c:
  - id: bus_a
    sda: GPIO45
    scl: GPIO46
    frequency: 400kHz










time:
  - platform: homeassistant
    id: esptime





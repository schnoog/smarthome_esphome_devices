esphome:
  name: homedisplay
  friendly_name: Advance-P4-10.1-inch
  on_boot:
    priority: 800
    then:
      - logger.log: "Backlight ON"
      - output.turn_on: backlight_pwm
      - delay: 200ms
      - output.turn_off: power_light
      - delay: 500ms
  
      - light.turn_on:
          id: back_light
          brightness: 1

esp32:
  variant: esp32p4
  engineering_sample: true  
  cpu_frequency: 360MHZ
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true




packages:   # as a list
  - !include common/display.yaml
  - !include common/mqtt.yaml
  - !include common/touchscreen.yaml
  - !include common/lvgldev.yaml


psram:
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V
  - channel: 4
    voltage: 2.5V

# Enable logging
logger:
  level: debug
  logs:
    lvgl: info
  hardware_uart: UART0

# Enable Home Assistant API
api:
  encryption:
    key: "CiYA/PPrO+exKqNUzuUdrzBO3ih9OVX66DbKyo9cB0g="

web_server:
  port: 80





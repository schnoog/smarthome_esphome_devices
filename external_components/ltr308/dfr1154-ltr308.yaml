esphome:
  name: dfr1154-ltr308

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
api:
ota:
  platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Eigene Komponente einbinden (Ordner "components" neben dieser YAML anlegen)
external_components:
  - source:
      type: local
      path: components

# Der LTR308 hängt auf dem DFR1154 am selben I2C-Bus wie die Kamera (SCCB)
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

sensor:
  - platform: ltr308
    name: "Umgebungslicht"
    gain: 3x
    resolution: 100ms
    update_interval: 10s

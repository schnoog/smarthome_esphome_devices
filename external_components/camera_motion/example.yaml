esphome:
  name: camera-motion-s3

esp32:
  board: esp32-s3-devkitc-1   # ggf. an dein genaues Freenove-S3-Modell anpassen
  framework:
    type: esp-idf

# Lokaler Pfad zu diesem components/-Ordner (dieses Verzeichnis ins ESPHome-
# Projekt kopieren, z.B. neben die YAML-Datei).
external_components:
  - source:
      type: local
      path: components

psram:
  mode: octal      # Freenove S3-CAM hat i.d.R. Octal-PSRAM, sonst "quad" verwenden
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  platform: esphome

logger:

# WICHTIG: Pins hier durch die exakte Pinbelegung deines konkreten
# Freenove-ESP32-S3-CAM-Boards ersetzen (siehe Freenove-Doku/Beispielsketch).
esp32_camera:
  id: my_camera
  name: "Frontdoor Camera"
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  i2c_pins:
    sda: GPIO4
    scl: GPIO5
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13
  reset_pin: -1
  resolution: 320x240     # klein halten, sonst wird die JPEG-Dekodierung fuer die Analyse zu teuer
  jpeg_quality: 10

camera_motion:
  id: my_motion
  camera_id: my_camera
  block_size: 16          # Groesse der Vergleichsbloecke in Pixeln
  block_threshold: 30     # ab welcher Pixel-Aenderung ein Block als "veraendert" zaehlt
  motion_threshold: 10    # wie viele veraenderte Bloecke fuer "Bewegung" noetig sind
  check_every_n_frames: 3 # nur jeden n-ten Frame analysieren (CPU sparen)

binary_sensor:
  - platform: camera_motion
    camera_motion_id: my_motion
    name: "Camera Motion"
    on_press:
      then:
        - logger.log: "Bewegung erkannt!"
        # Beispiele fuer moegliche Aktionen:
        # - switch.turn_on: relay_licht
        # - homeassistant.event:
        #     event: esphome.motion_detected

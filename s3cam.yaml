          }

# ----------------------------
# GPIO Outputs
# ----------------------------
output:
  - platform: gpio
    pin: GPIO41                       # Speaker gain control
    id: speaker_gain
  - platform: gpio
    pin: GPIO40                       # Audio mode selection
    id: speaker_mode
  - id: led_status                    # System status LED
    platform: gpio
    pin: GPIO3
  - id: ir_led                        # Infrared night vision
    platform: gpio
    pin: GPIO47                       # High-current capable pin

# ----------------------------
# Lighting Entities
# ----------------------------
light:
  - platform: binary                  # Status indicator
    name: "LED Status"
    output: led_status
  - platform: binary                  # IR illumination
    name: "IR Night Vision"
    output: ir_led
    restore_mode: RESTORE_DEFAULT_OFF # Stay off after reboot













# =============================================
# Audio Subsystem (I2S)
# =============================================

# ----------------------------
# Audio Hardware Config
# ----------------------------
i2s_audio:
  i2s_lrclk_pin: GPIO46              # Left/right clock
  i2s_bclk_pin: GPIO45               # Bit clock

# ----------------------------
# Microphone Input
# ----------------------------
microphone:
  - platform: i2s_audio
    adc_type: external
    i2s_din_pin: GPIO39               # Data input from mic
    pdm: true                         # Pulse-density modulation

# ----------------------------
# Speaker Output (MAX98357)
# ----------------------------
speaker:
  - platform: i2s_audio
    id: speaker_id
    dac_type: external                # Using external DAC
    i2s_dout_pin: GPIO42              # Audio data to amplifier
    channel: mono

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: speaker_id
    source_speakers:
      - id: media_spk_mixer_input
      - id: announcement_spk_mixer_input

media_player:
  - platform: speaker
    name: "Speaker"
    id: speaker_media_player_id
    media_pipeline:
      speaker: media_spk_mixer_input
    announcement_pipeline:
      speaker: announcement_spk_mixer_input













switch:
  - platform: template
    name: "Auto Exposure 2"
    id: aec_2
    icon: mdi:auto-fix
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      lambda: |-
        id(espcam).set_aec2(true);
        id(espcam_update) = true;
    turn_off_action:
      lambda: |-
        id(espcam).set_aec2(false);
        id(espcam_update) = true;


select:
  - platform: template
    name: "Special Effects"
    icon: mdi:filter
    id: effect
    options:
      - "None"
      - "Negative"
      - "Grayscale"
      - "Red Tint"
      - "Green Tint"
      - "Blue Tint"
      - "Sepia"
    initial_option: "None"
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_special_effect((esphome::esp32_camera::ESP32SpecialEffect)id(effect).active_index().value());
        id(espcam_update) = true;
# Option List for White Balance
  - platform: template
    name: "White Balance Mode"
    id: wb
    icon: mdi:white-balance-auto
    options:
      - "Auto"
      - "Sunny"
      - "Cloudy"
      - "Office"
      - "Home"
    initial_option: "Auto"
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_wb_mode((esphome::esp32_camera::ESP32WhiteBalanceMode)id(wb).active_index().value());
        id(espcam_update) = true;
# Option list for AEC mode
  - platform: template
    name: "Auto Exposure Mode"
    id: aec
    icon: mdi:auto-fix
    options:
      - "Manual"
      - "Auto"
    initial_option: "Auto"
    optimistic: True
    on_value:
      lambda: |-
        // if you're looking closely, you may notice that AEC uses the Enum defined for Gain_control.
        // this is how it is defined in the component source code since they both only have "auto" & "manual"
        id(espcam).set_aec_mode((esphome::esp32_camera::ESP32GainControlMode)id(aec).active_index().value());
        id(espcam_update) = true;
# Option list for Gain Control Mode
  - platform: template
    name: "Gain Control Mode"
    id: gc
    icon: mdi:auto-fix
    options:
      - "Manual"
      - "Auto"
    initial_option: "Auto"
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_agc_mode((esphome::esp32_camera::ESP32GainControlMode)id(gc).active_index().value());
        id(espcam_update) = true;
# Option list for Gain Ceiling (apparently this is somewhat equivilant to ISO settings)
  - platform: template
    name: "Gain Ceiling"
    id: g_ceiling
    options:
      - "2x"
      - "4x"
      - "8x"
      - "16x"
      - "32x"
      - "64x"
      - "128x"
    initial_option: "128x"
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_agc_gain_ceiling((esphome::esp32_camera::ESP32AgcGainCeiling)id(g_ceiling).active_index().value());
        id(espcam_update) = true;

# configure number sliders for these parameters to make them available in HA
number:
# While the sliders for Contrast, Brightness, and Saturation all work and change the parameters of the sensor
# they do not seem to make any difference to the image output
  - platform: template
    name: "Contrast"
    id: contrast
    icon: mdi:contrast-box
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_contrast(id(contrast).state);
        id(espcam_update) = true;
# Number Slider for Brightness
  - platform: template
    name: "Brightness"
    id: brightness
    icon: mdi:brightness-6
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_brightness(id(brightness).state);
        id(espcam_update) = true;
# Number Slider for Saturation
  - platform: template
    name: "Saturation"
    id: saturation
    icon: mdi:palette-outline
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_saturation(id(saturation).state);
        id(espcam_update) = true;
# Number Slider for Gain Value
  - platform: template
    name: "Gain Value"
    id: g_value
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_agc_value(id(g_value).state);
        id(espcam_update) = true;
# Number slider for AE Level
  - platform: template
    name: "AE Level"
    id: ae_level
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_ae_level(id(ae_level).state);
        id(espcam_update) = true;
# Number Slider for AE Value (step set to 10)
# I tried using steps of 1 (too fine to control) and 100 (to coarse for the values) and settled on 10
  - platform: template
    name: "AE Value"
    id: ae_value
    min_value: 0
    max_value: 1200
    step: 10
    initial_value: 1200
    mode: SLIDER
    optimistic: True
    on_value:
      lambda: |-
        id(espcam).set_aec_value(id(ae_value).state);
        id(espcam_update) = true;




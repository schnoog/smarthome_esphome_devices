substitutions:
  name: esphome-cams3
  friendly_name: NewESP32-S3-Cam

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: False # this appends to 'name' NOT 'friendly_name'
  # arduino.memory.type was key to getting PSRAM working for this board
  platformio_options:

    build_flags: 
      - "-DBOARD_HAS_PSRAM"
    board_build.arduino.memory_type: qio_opi

  
####    board_build.flash_mode: dio
  # add code to program's loop() function
  on_loop:
    - lambda: |-
        if(id(wifi_component).is_connected()) {
          if (id(espcam_update)) {
            id(espcam).update_camera_parameters();
            if(id(debug)) { id(espcam).dump_config(); }
            id(espcam_update) = false;
          }
        }





esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB 
  framework:
    type: esp-idf
    version: recommended
#    sdkconfig_options:
#      CONFIG_ESP32_S3_BOX_BOARD: "y"
   
psram:
  mode: octal
  speed: 80MHz





mqtt:
  id: esp32s3cam
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_retain: true
  discovery_unique_id_generator: mac
  discovery_object_id_generator: device_name
  birth_message:
  will_message:
  shutdown_message:



# Enable logging
logger:



ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: "CiYA/PPrO+exKqNUzuUdrzBO3ih9OVX66DbKyo9cB0g="
  reboot_timeout: 0s                        # Prevent reboot if HA connection lost



# Add the credentials to connect to your wifi network
wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password


web_server:
  port: 80






esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

binary_sensor:
# shows the wifi status of the ESP32 Camera
  - platform: status
    name: "Status"
  - platform: camera_motion
    camera_motion_id: my_motion
    device_class: motion
    name: "Camera Motion"
    on_press:
      then:
        - logger.log: "Bewegung erkannt!"
        - mqtt.publish:
            topic: "motion/detection"
            payload: '1'
    on_release:
      then:
        - logger.log: "Es ist wieder ruhig!"
        - mqtt.publish:
            topic: "motion/detection"
            payload: '0'
#        - lambda: |-
#            id(espcam).set_frame_size((esphome::esp32_camera::ESP32CameraFrameSize)FRAMESIZE_SXGA);
#            // some function to change the frame_size
#            id(espcam_update) = true;        
       
#i2c:
#  sda: GPIO8
#  scl: GPIO9
#  scan: true

sensor:
# ltr308
  - platform: ltr308
    i2c_id: bus_a
    name: "Umgebungslicht"
    gain: 3x
    resolution: 100ms
    update_interval: 10s
# will show the Uptime for the card if you're interested
  - platform: uptime
    name: 'Uptime'
    update_interval: 15s
# shows the Wifi signal strength in dB (decibels)
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s


button:
# enable a Factory Reset button if you want one
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory reset"
# enable a reboot button
  - platform: restart
    name: "Restart"
# enable a 'safe mode' reboot button
  - platform: safe_mode
    name: "Safe Mode"

text_sensor:
# Add text output for Wifi Info
  - platform: wifi_info
    ip_address:
      name: "Wifi Info: IP Address"
    ssid:
      name: "Wifi Info: SSID"
    bssid:
      name: "Wifi Info: BSSID"
#    mac_address:
#      name: "Wifi Info: MAC Address"
#    dns_address:
#      name: "Wifi Info: DNS Address"

globals:
# the debug parameter determines whether a config dump is done after making changes
# this is helpful when doing initial setup, but once everything is working, I turn it off
  - id: debug
    type: bool
    initial_value: 'false'
# value to track if camera parameters have been changed
#   used to trigger the loop() code inserted in 'esphome' section above
  - id: espcam_update
    type: bool
    initial_value: 'false'

external_components:
  - source:
      type: local
      path: external_components


camera_motion:
  id: my_motion
  camera_id: espcam
  block_size: 16          # Groesse der Vergleichsbloecke in Pixeln
  block_threshold: 30     #def:30 # ab welcher Pixel-Aenderung ein Block als "veraendert" zaehlt
  motion_threshold: 40    #def:20 # wie viele veraenderte Bloecke fuer "Bewegung" noetig sind
  check_interval: 1s
#  check_every_n_frames: 10 # nur jeden n-ten Frame analysieren (CPU sparen)

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO9
  scan: true


esp32_camera:
  id: espcam
  name: MyCamera
  
 # Hardware Interface
  external_clock:
    pin: GPIO5                        # XCLK pin
    frequency: 20MHz                  # Critical for camera timing
  i2c_id: bus_a 
#  i2c_pins:
#    sda: GPIO8                        # I2C data
#    scl: GPIO9                        # I2C clock
  data_pins: [GPIO16, GPIO18, GPIO21, GPIO17, GPIO14, GPIO7, GPIO6, GPIO4]  # 8-bit data bus
  vsync_pin: GPIO1                    # Vertical sync
  href_pin: GPIO2                     # Horizontal reference
  pixel_clock_pin: GPIO15             # Pixel clock
  
#  frame_buffer_location: DRAM
#  pixel_format: RGB565
#  resolution: 640x480 #240x176 #320X240 #800x600 # my default
  resolution: 320X240 # for testing, quicker screen reactions
  jpeg_quality: 12 #15
  max_framerate: 60fps
  idle_framerate: 1fps
  frame_buffer_count: 2
  vertical_flip: true
  horizontal_mirror: false
  contrast: 0
  brightness: 0
  saturation: 0
  special_effect: NONE
  # exposure settings
  aec_mode: AUTO
  aec2: False
  ae_level: 0
  aec_value: 300
  # gain settings
  agc_mode: AUTO
  agc_gain_ceiling: 2X
  agc_value: 0
  # white balance setting
  wb_mode: AUTO
  # test pattern
  test_pattern: False
  on_image:
    then:
      - lambda: |-

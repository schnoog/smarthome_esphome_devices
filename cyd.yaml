esphome:
  name: cyd1




esp32:
  board: esp32dev
  framework:
    type: arduino

logger:


web_server:
  port: 80


api:
  encryption:
    key: "CiYA/PPrO+exKqNUzuUdrzBO3ih9OVX66DbKyo9cB0g="
  reboot_timeout: 0s                        # Prevent reboot if HA connection lost
  
i2c:
  - sda: 27
    scl: 22
    scan: true

spi:
  - id: tft
    clk_pin: 14
    mosi_pin: 13
#    miso_pin:
#      number: 12
#      ignore_strapping_warning: true
#  - id: touch
#    clk_pin: 25
#    mosi_pin: 32
#    miso_pin: 39

output:
  - id: backlight_pwm
    platform: ledc
    pin: 21
  - id: output_red
    platform: ledc
    pin: 4
    inverted: true
  - id: output_green
    platform: ledc
    pin: 16
    inverted: true
  - id: output_blue
    platform: ledc
    pin: 17
    inverted: true

light:
  - id: backlight
    platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    restore_mode: ALWAYS_ON
  - id: led
    platform: rgb
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

time:
  - platform: homeassistant
    id: esptime

display:
  - id: main_display
    platform: ili9xxx
    model: ILI9341
    spi_id: tft

    cs_pin: GPIO15
    dc_pin: GPIO2

    dimensions:
      width: 320
      height: 240

    rotation: 90
    invert_colors: false
    color_palette: 8BIT
    update_interval: 1s

    lambda: |-
      it.fill(Color::BLACK);

      it.print(20, 5, id(Icons40), TextAlign::TOP_CENTER, "\U000F1A7F");
      it.print(20, 50, id(Icons40), TextAlign::TOP_CENTER, "\U000F058E");


      it.printf(45, 5, id(Verdana36), "%.1f°C", id(temperatur).state);
      it.printf(45, 50, id(Verdana36), "%.1f%%", id(luftfeuchtigkeit).state);
 
      it.line(180, 0, 180, 90); 
      it.printf(185, 15, id(font_large), "%.0f", id(luftdruck).state);
      it.print(185,45,id(font_large),"hpa");
 
      it.line(0, 95, 240, 95); 






      auto now = id(esptime).now();
      int hh = 0;
      int mm = 0;




      it.line(120, 95, 120, 290);  

      it.print(1, 105, id(VerdanaBold16), "Wohnzimmer");

      if (sscanf(id(s3Update).state.c_str(), "%d:%d", &hh, &mm) == 2) {

        int now_min = now.hour * 60 + now.minute;
        int msg_min = hh * 60 + mm;

        int diff = now_min - msg_min;

        // Mitternacht berücksichtigen
        if (diff < 0)
          diff += 24 * 60;

        it.printf(10, 175 , id(VerdanaBold16), "%s" , id(s3Update).state.c_str() );
        if (diff < 11){
          it.printf(10, 135 , id(Verdana28), "%.1f°C", id(s3Temperatur).state);

        } else {
          it.printf(10, 135, id(Verdana20), "%.1f°C ?", id(s3Temperatur).state);
        }
      } else {
        it.printf(10, 135, id(Verdana20), "%.1f°C ?", id(s3Temperatur).state);

      }




      it.print(130, 105, id(VerdanaBold16), "Hochbeet");
      
      if (sscanf(id(s1Update).state.c_str(), "%d:%d", &hh, &mm) == 2) {

        int now_min = now.hour * 60 + now.minute;
        int msg_min = hh * 60 + mm;

        int diff = now_min - msg_min;

        // Mitternacht berücksichtigen
        if (diff < 0)
          diff += 24 * 60;
        it.printf(130, 170 , id(Verdana20),"%.1f °C", id(s1ExtTemperatur).state);


        if (diff < 11){
          it.printf(130, 135, id(Verdana28), "%.1f °C", id(s1Temperatur).state);
        } else {
          it.printf(130, 135, id(Verdana20), "%.1f °C ?", id(s1Temperatur).state);       
        }
      } else {
        it.printf(130, 135, id(Verdana20), "%.1f °C ?", id(s1Temperatur).state);   
      }




      it.line(0, 195, 240, 195); 

      it.print(1, 205, id(VerdanaBold16), "Vorne");
      
      if (sscanf(id(s2Update).state.c_str(), "%d:%d", &hh, &mm) == 2) {

        int now_min = now.hour * 60 + now.minute;
        int msg_min = hh * 60 + mm;

        int diff = now_min - msg_min;

        // Mitternacht berücksichtigen
        if (diff < 0)
          diff += 24 * 60;
        it.printf(10, 265 , id(VerdanaBold16), "%s" , id(s2Update).state.c_str() );
        if (diff < 11){
          it.printf(10, 225, id(Verdana28), "%.1f °C", id(s2Temperatur).state);
        } else {
          it.printf(10, 225, id(Verdana20), "%.1f °C ?", id(s2Temperatur).state);       
        }
      } else {
        it.printf(10, 225, id(Verdana20), "%.1f °C ?", id(s2Temperatur).state);   
      }





      it.print(130, 205, id(VerdanaBold16), "Küche");
      

      if (sscanf(id(s4Update).state.c_str(), "%d:%d", &hh, &mm) == 2) {

        int now_min = now.hour * 60 + now.minute;
        int msg_min = hh * 60 + mm;

        int diff = now_min - msg_min;

        // Mitternacht berücksichtigen
        if (diff < 0)
          diff += 24 * 60;
        it.printf(130, 265 , id(VerdanaBold16), "%s" , id(s4Update).state.c_str() );
        if (diff < 11){
          it.printf(130, 225, id(Verdana28), "%.1f °C", id(s4Temperatur).state);
        } else {
          it.printf(130, 225, id(Verdana20), "%.1f °C ?", id(s4Temperatur).state);      
        }
      } else {
        it.printf(130, 225, id(Verdana20), "%.1f °C ?", id(s4Temperatur).state);   
      }







      it.line(0, 290, 240, 290); 
      it.strftime(80, 291, id(Verdana28) , "%H:%M", id(esptime).now());



